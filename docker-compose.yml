# Local development environment for testing the Honeycomb Grafana plugin.
#
# Usage:
#   1. Build the plugin:   npm run build && mage build:linux
#      (on Apple Silicon:  npm run build && mage build:linuxARM64)
#   2. Start Grafana:      docker compose up
#   3. Open Grafana:       http://localhost:3000 (admin/admin)
#   4. Add the Honeycomb datasource and configure your API key.
#
# dist/ is mounted directly so changes are picked up on Grafana restart
# (ctrl-c then docker compose up). Pin a Grafana version with
# GRAFANA_VERSION=11.5.0 docker compose up.
#
# Build before the first `docker compose up`. Starting the stack with no dist/
# makes Docker create it as an empty root-owned directory, which then makes
# `npm run build` fail on permissions. If that happens: `sudo rm -rf dist`.

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: honeycomb-grafana-dev
    ports:
      # Override with GRAFANA_PORT if 3000 is taken on your machine.
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # Allow unsigned plugins in development.
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=honeycombio-honeycomb-datasource
      - GF_LOG_LEVEL=debug
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
    volumes:
      # Mount the built plugin (dist/ only — not the whole repo).
      - ./dist:/var/lib/grafana/plugins/honeycombio-honeycomb-datasource
      # Mount provisioning config for auto-configured datasource.
      - ./provisioning:/etc/grafana/provisioning
      # Persist Grafana state.
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-storage:
