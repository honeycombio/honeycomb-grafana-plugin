name: Version Bump & Tag

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      # Empty when the bump was skipped, which gates the release job below.
      tag: ${{ steps.tag.outputs.tag }}
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Skip if last commit is a version bump
        id: check
        run: |
          MSG=$(git log -1 --format='%s')
          if [[ "$MSG" == chore:\ release\ v* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump type
        if: steps.check.outputs.skip == 'false'
        id: bump_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version
        if: steps.check.outputs.skip == 'false'
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          NEXT=$(npx semver "$CURRENT" -i "${{ steps.bump_type.outputs.type }}")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Update version in source files
        if: steps.check.outputs.skip == 'false'
        run: |
          NEXT="${{ steps.version.outputs.next }}"

          # package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${NEXT}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # src/plugin.json needs no edit: it uses %VERSION%/%TODAY%
          # placeholders that webpack stamps from package.json at build time.

          # pkg/honeycomb/client.go (pluginVersion constant)
          sed -i "s|pluginVersion = \"[0-9]*\.[0-9]*\.[0-9]*\"|pluginVersion = \"${NEXT}\"|g" pkg/honeycomb/client.go

      - name: Commit and tag
        id: tag
        if: steps.check.outputs.skip == 'false'
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json pkg/honeycomb/client.go
          git commit -m "chore: release v${NEXT} [skip ci]"
          # Annotated, and pushed explicitly: --follow-tags silently skips
          # lightweight tags, which is why v0.1.1 and v0.1.2 never reached
          # origin and no release was ever published.
          git tag -a "v${NEXT}" -m "v${NEXT}"
          git push origin main
          git push origin "v${NEXT}"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"

  # Call the release workflow directly rather than relying on the tag push to
  # trigger it: events created with GITHUB_TOKEN do not start new workflow runs,
  # so `on: push: tags` in release.yml never fires for an automated bump.
  release:
    name: Release
    needs: bump
    if: needs.bump.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
