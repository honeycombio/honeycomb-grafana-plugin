name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Go backend: compile, test (race detector), lint
  # ---------------------------------------------------------------------------
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build backend (all packages)
        run: go build ./pkg/...

      # Scoped to ./pkg/... — `./...` would also traverse Go files that ship
      # inside node_modules.
      - name: Run Go tests
        run: go test -race -coverprofile=coverage.out ./pkg/...

      - name: Enforce Go coverage floor
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          echo "Total Go coverage: ${TOTAL}%"
          MINIMUM=60
          if awk -v t="$TOTAL" -v m="$MINIMUM" 'BEGIN {exit !(t < m)}'; then
            echo "ERROR: Go coverage ${TOTAL}% is below the ${MINIMUM}% floor."
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall

  # ---------------------------------------------------------------------------
  # TypeScript frontend: typecheck, lint, test, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --ci --coverage

      - name: Build frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Package + smoke test: prove every PR could ship.
  # Builds the full plugin, packages it with the same script the release
  # workflow uses, installs the zip into a real Grafana container, and checks
  # that Grafana loads the plugin and can spawn the backend binary.
  # ---------------------------------------------------------------------------
  package:
    name: Package & smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build backend (linux/amd64)
        run: mage build:linux

      - name: Package plugin
        run: ./scripts/package.sh

      - name: Smoke test packaged plugin in Grafana
        run: ./scripts/smoke-test.sh

      - name: Validate with grafana/plugin-validator
        # Informational for now: the validator also enforces catalog-submission
        # rules (signing, screenshots) that do not apply to GitHub-only
        # releases. Promote to blocking once tuned via a validator config.
        #
        # Pinned rather than @latest: this compiles and runs third-party code in
        # a job with the repo checked out, so the version should change only
        # when we choose to bump it. continue-on-error (not `|| true`) keeps the
        # step non-blocking while still surfacing the real exit code in the log.
        continue-on-error: true
        run: |
          go run github.com/grafana/plugin-validator/pkg/cmd/plugincheck2@v0.41.0 \
            build/*.zip

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: |
            build/*.zip
            build/*.sha1
          retention-days: 14

  # ---------------------------------------------------------------------------
  # E2E: drive a real Grafana (min supported + latest) with Playwright.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Grafana ${{ matrix.grafana-version }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (plugin.json grafanaDependency) and latest.
        grafana-version: ['11.0.0', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Mage
        run: go install github.com/magefile/mage@v1.17.2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build plugin
        run: |
          npm run build
          mage build:linux

      - name: Start Grafana
        run: GRAFANA_VERSION=${{ matrix.grafana-version }} docker compose up -d

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Grafana
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Grafana did not become healthy"
          docker compose logs grafana | tail -50
          exit 1

      - name: Run e2e tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-grafana-${{ matrix.grafana-version }}
          path: playwright-report/
          retention-days: 7
